<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mondo"><link rel="manifest" href="manifest.json"><title>Mondo – Übersetzer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13283c;background:#f2f6fa}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);min-height:100dvh}.app{max-width:560px;margin:auto;padding:16px 0 30px}header{display:flex;align-items:center;justify-content:space-between;color:#102b46;margin:4px 2px 18px}h1{font-size:27px;margin:0}header small{color:#5c7083}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #17324d12}.langs{display:flex;gap:9px;align-items:center}.langs select{min-width:0;flex:1;padding:13px 9px;border:1px solid #d6e0ea;border-radius:12px;background:white;font-size:16px;color:#17324d}.swap{border:0;background:#eaf2f9;border-radius:50%;width:42px;height:42px;font-size:20px;color:#123957}label{font-size:14px;font-weight:650;display:block;margin:8px 0}.entry, .result{width:100%;min-height:112px;border:0;resize:vertical;font:18px/1.45 inherit;color:#16314a}.entry{outline:none}.result{white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px;color:#718397;margin-top:6px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:650;background:#e8f0f7;color:#143858;min-height:48px}.primary{background:#1266a5;color:white;flex:1}.listening{background:#b32635}.status{min-height:20px;color:#536b80;font-size:14px;margin-top:10px}.output{background:#f8fbfd;border-radius:14px;padding:14px;min-height:92px}.outhead{display:flex;justify-content:space-between;align-items:center}.outhead label{margin:0}.icon{border:0;background:#e8f0f7;border-radius:10px;padding:10px;font-size:17px}.foot{text-align:center;color:#75879a;font-size:12px;padding:7px}.conversation{width:100%;margin-top:10px}.notice{font-size:13px;line-height:1.45;color:#526c82}
</style></head><body><main class="app"><header><div><h1>🌐 Mondo</h1><small>Einfach verstehen. Überall.</small></div><button class="icon" id="installHelp" aria-label="Zum Home-Bildschirm hinzufügen">ⓘ</button></header>
<section class="card"><div class="langs"><select id="from" aria-label="Ausgangssprache"></select><button class="swap" id="swap" aria-label="Sprachen tauschen">⇄</button><select id="to" aria-label="Zielsprache"></select></div>
<label for="text">Text oder Spracheingabe</label><textarea class="entry" id="text" placeholder="Text hier eingeben …" aria-label="Zu übersetzender Text"></textarea><div class="buttons"><button class="btn primary" id="mic">🎙️ Jetzt sprechen</button><button class="btn" id="translate">Übersetzen</button></div><div class="status" id="status" role="status" aria-live="polite">Bereit</div></section>
<section class="card"><div class="outhead"><label>Übersetzung</label><span><button class="icon" id="speak" title="Vorlesen">🔊</button> <button class="icon" id="copy" title="Kopieren">📋</button></span></div><div class="output result" id="result" aria-live="polite">Die Übersetzung erscheint hier.</div><button class="btn conversation" id="conversation">↔️ Gesprächsmodus</button><p class="notice">Für Übersetzungen ist eine Internetverbindung nötig. Verfügbarkeit und Qualität können je nach Sprache variieren. Spracheingabe verwendet die Spracherkennung des Browsers.</p></section><p class="foot">Mondo · Kostenlos nutzbar · Keine Anmeldung</p></main>
<script>
const languages=[['auto','Sprache erkennen'],['de','Deutsch'],['en','Englisch'],['fr','Französisch'],['es','Spanisch'],['it','Italienisch'],['pt','Portugiesisch'],['nl','Niederländisch'],['sv','Schwedisch'],['da','Dänisch'],['no','Norwegisch'],['fi','Finnisch'],['pl','Polnisch'],['cs','Tschechisch'],['sk','Slowakisch'],['hu','Ungarisch'],['ro','Rumänisch'],['el','Griechisch'],['ru','Russisch'],['uk','Ukrainisch'],['tr','Türkisch'],['ar','Arabisch'],['he','Hebräisch'],['hi','Hindi'],['bn','Bengalisch'],['zh','Chinesisch'],['ja','Japanisch'],['ko','Koreanisch'],['th','Thai'],['vi','Vietnamesisch'],['id','Indonesisch'],['ms','Malaiisch'],['sw','Suaheli'],['fa','Persisch'],['ur','Urdu'],['ta','Tamil'],['te','Telugu'],['af','Afrikaans'],['bg','Bulgarisch'],['hr','Kroatisch'],['sr','Serbisch'],['sl','Slowenisch'],['et','Estnisch'],['lv','Lettisch'],['lt','Litauisch'],['is','Isländisch'],['ca','Katalanisch'],['fil','Filipino']];const from=document.querySelector('#from'),to=document.querySelector('#to');for(const [code,name] of languages){from.add(new Option(name,code));to.add(new Option(name,code))}from.value='de';to.value='en';const text=document.querySelector('#text'),result=document.querySelector('#result'),status=document.querySelector('#status');
document.querySelector('#swap').onclick=()=>{let a=from.value;from.value=to.value==='auto'?'de':to.value;to.value=a==='auto'?'en':a};
async function translate(){const q=text.value.trim();if(!q){status.textContent='Bitte zuerst Text eingeben oder sprechen.';return}if(to.value==='auto'){status.textContent='Bitte eine Zielsprache auswählen.';return}status.textContent='Übersetze …';try{const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent((from.value==='auto'?'de':from.value)+'|'+to.value);const res=await fetch(url);if(!res.ok)throw Error();const data=await res.json();if(data.responseStatus!==200)throw Error(data.responseDetails||'Übersetzung nicht verfügbar');result.textContent=data.responseData.translatedText;status.textContent='Übersetzung fertig';}catch(e){status.textContent='Übersetzung gerade nicht verfügbar. Bitte Internetverbindung prüfen und erneut versuchen.'}}
document.querySelector('#translate').onclick=translate;let rec=null,listening=false;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(Speech){rec=new Speech();rec.interimResults=true;rec.continuous=true;rec.onresult=e=>{let finalText='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=phrase;else interim+=phrase}text.value=(text.dataset.base||'')+finalText+interim;if(finalText){text.dataset.base=(text.dataset.base||'')+finalText;translate()}};rec.onerror=()=>{status.textContent='Spracherkennung nicht verfügbar. Du kannst Text eintippen.';stopMic()};rec.onend=()=>{if(listening){try{rec.start()}catch{}}}}function stopMic(){listening=false;text.dataset.base='';document.querySelector('#mic').classList.remove('listening');document.querySelector('#mic').textContent='🎙️ Jetzt sprechen'}document.querySelector('#mic').onclick=()=>{if(!rec){status.textContent='Dieser Browser unterstützt keine Spracheingabe. Bitte Text eintippen.';return}if(listening){stopMic();rec.stop();status.textContent='Spracheingabe beendet';return}text.dataset.base='';text.value='';rec.lang=(from.value==='auto'?'de':from.value);try{rec.start();listening=true;document.querySelector('#mic').classList.add('listening');document.querySelector('#mic').textContent='⏹️ Zuhören beenden';status.textContent='Höre zu …'}catch{status.textContent='Mikrofon konnte nicht gestartet werden. Bitte Berechtigung prüfen.'}};
document.querySelector('#speak').onclick=()=>{if(!result.textContent||result.textContent==='Die Übersetzung erscheint hier.')return;const u=new SpeechSynthesisUtterance(result.textContent);u.lang=to.value; speechSynthesis.speak(u)};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.textContent);status.textContent='Übersetzung kopiert'}catch{status.textContent='Kopieren wird von diesem Browser nicht unterstützt'}};document.querySelector('#conversation').onclick=()=>{const prior=from.value;from.value=to.value;to.value=prior==='auto'?'de':prior;text.value='';result.textContent='Die Übersetzung erscheint hier.';status.textContent='Sprachen getauscht – jetzt spricht die andere Person.'};document.querySelector('#installHelp').onclick=()=>alert('Auf dem iPhone in Safari öffnen, unten auf „Teilen“ tippen und „Zum Home-Bildschirm“ auswählen.');
</script></body></html>
